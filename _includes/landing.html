<!doctype html>
<html lang="en">
<head>
  {% include head.html css='landing.css' %}
  {% if site.maintenance %}<meta name="robots" content="noindex">{% endif %}
</head>
<body>
  <pre class="field" id="field" aria-hidden="true"></pre>

  <main class="seal">
    <h1>{{ site.title }}</h1>
    {% if site.maintenance %}
    <p class="status">{{ site.maintenance_text | default: 'coming soon' }}</p>
    {% else %}
    <nav class="links" aria-label="Links">
      <a href="{{ '/blog/' | relative_url }}">read the blog</a>
    </nav>
    {% endif %}
  </main>

  <script src="{{ '/assets/js/field.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
