<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="theme-color" content="#050505">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/landing.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <pre class="field" id="field" aria-hidden="true"></pre>

  <header class="bar">
    <a href="{{ '/' | relative_url }}">{{ site.title | downcase }}</a>
    <nav>
      <a href="{{ '/blog/' | relative_url }}">writing</a>
      <a href="{{ '/about/' | relative_url }}">about</a>
      {% for link in site.links %}<a href="{{ link.url }}">{{ link.label | downcase }}</a>{% endfor %}
    </nav>
  </header>

  <main class="intro">
    <h1>{{ site.title }}</h1>
    <p>{{ site.tagline }}</p>
    <a class="enter" href="{{ '/blog/' | relative_url }}">read the blog <span aria-hidden="true">→</span></a>
  </main>

  <script src="{{ '/assets/js/field.js' | relative_url }}" defer></script>
</body>
</html>
